<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | ZoRent</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header class="header">

    <div class="logo">

        <span class="logo-icon">🌿</span>

        <span>ZoRent</span>

    </div>


    <nav class="nav">

        <a href="index.html">
            Home
        </a>

        <a href="index.html#explore">
            Explore
        </a>

        <a href="index.html#categories">
            Categories
        </a>

        <a href="list-property.html">
            List Your Property
        </a>

        <a href="profile.html">
            My Profile
        </a>

    </nav>

</header>



<main class="listing-page">


    <div class="listing-intro">

        <span class="section-label">
            ZORENT ACCOUNT
        </span>

        <h1>
            My Profile
        </h1>

        <p>
            Manage your account and properties.
        </p>

    </div>



    <section class="form-section">


        <!-- PROFILE -->

        <div
            style="
                padding:25px;
                border:1px solid #ddd;
                border-radius:16px;
                background:#fff;
                margin-bottom:25px;
            "
        >

            <h2>
                Account
            </h2>

            <p>
                <strong>
                    Email:
                </strong>

                <span id="userEmail">
                    Loading...
                </span>
            </p>


            <button
                id="logoutBtn"
                type="button"
                style="
                    padding:10px 18px;
                    border:0;
                    border-radius:8px;
                    background:#dc3545;
                    color:white;
                    cursor:pointer;
                "
            >
                Logout
            </button>

        </div>



        <!-- MY PROPERTIES -->

        <div
            style="
                padding:25px;
                border:1px solid #ddd;
                border-radius:16px;
                background:#fff;
            "
        >

            <h2>
                My Properties
            </h2>

            <div id="myProperties">

                <p>
                    Loading your properties...
                </p>

            </div>

        </div>


    </section>


</main>



<script src="supabase.js"></script>


<script>

/* =====================================================
   CHECK LOGIN
===================================================== */

async function loadProfile() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    document.getElementById(
        "userEmail"
    ).textContent =
        user.email || "-";


    loadMyProperties(
        user.id
    );

}



/* =====================================================
   LOAD MY PROPERTIES
===================================================== */

async function loadMyProperties(userId) {

    const container =
        document.getElementById(
            "myProperties"
        );


    const {
        data,
        error
    } = await supabaseClient

        .from("properties")

        .select("*")

        .eq(
            "owner_id",
            userId
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    console.log(
        "MY PROPERTIES:",
        data
    );


    console.log(
        "PROPERTY ERROR:",
        error
    );


    if (error) {

        container.innerHTML = `

            <p>
                Unable to load your properties.
            </p>

        `;

        console.error(error);

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        container.innerHTML = `

            <div
                style="
                    padding:30px;
                    text-align:center;
                "
            >

                <h3>
                    No properties yet
                </h3>

                <p>
                    You have not submitted
                    any properties.
                </p>

                <a
                    href="list-property.html"
                >
                    List Your Property
                </a>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    data.forEach(property => {


        const card =
            document.createElement(
                "div"
            );


        card.style.padding =
            "20px";

        card.style.border =
            "1px solid #ddd";

        card.style.borderRadius =
            "12px";

        card.style.marginBottom =
            "15px";


        card.innerHTML = `

            <h3>
                ${
                    property.property_name ||
                    "Unnamed Property"
                }
            </h3>


            <p>

                <strong>
                    Category:
                </strong>

                ${
                    property.category ||
                    "-"
                }

            </p>


            <p>

                <strong>
                    Status:
                </strong>

                <span
                    style="
                        padding:5px 10px;
                        border-radius:15px;
                        background:#eee;
                    "
                >

                    ${
                        property.status ||
                        "pending"
                    }

                </span>

            </p>
<a
    href="edit-property.html?id=${property.id}"
    style="
        display:inline-block;
        margin-top:15px;
        padding:10px 18px;
        border-radius:8px;
        background:#198754;
        color:white;
        text-decoration:none;
    "
>
    ✏️ Edit Property
</a>
<button
    type="button"
    onclick="deleteProperty('${property.id}')"
    style="
        margin-top:15px;
        margin-left:8px;
        padding:10px 18px;
        border:0;
        border-radius:8px;
        background:#dc3545;
        color:white;
        cursor:pointer;
    "
>
    🗑️ Delete Property
</button>
        `;


        container.appendChild(
            card
        );

    });

}



/* =====================================================
   LOGOUT
===================================================== */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async function() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "login.html";

        }
    );



/* =====================================================
   START
===================================================== */

loadProfile();
async function deleteProperty(propertyId) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this property?"
        );

    if (!confirmed) {
        return;
    }


    try {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        const {
            error
        } =
            await supabaseClient

                .from("properties")

                .delete()

                .eq(
                    "id",
                    propertyId
                )

                .eq(
                    "owner_id",
                    user.id
                );


        if (error) {

            console.error(error);

            alert(
                "Could not delete property:\n\n" +
                error.message
            );

            return;

        }


        alert(
            "Property deleted successfully."
        );


        loadMyProperties(
            user.id
        );

    }

    catch (error) {

        console.error(error);

        alert(
            "Something went wrong:\n\n" +
            error.message
        );

    }

}
</script>


</body>

</html>
